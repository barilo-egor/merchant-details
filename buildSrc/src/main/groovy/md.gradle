plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'tgb.cryptoexchange'
version = '0.31.0'

repositories {
    mavenCentral()
    mavenLocal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group.startsWith('com.fasterxml.jackson')
                    && !(requested.name in ['jackson-bom', 'jackson-annotations', 'jackson-core', 'jackson-databind'])) {
                throw new GradleException("Jackson 2 запрещён, используйте Jackson 3 (tools.jackson): ${requested.group}:${requested.name}")
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.9'
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4'
    }
}

dependencies {
    implementation 'tgb.cryptoexchange:commons:1.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
